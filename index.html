<style>
/* Layout: one centered exercise-book column; menu cards, then a ruled play sheet with a two-row correction grid. */
:root {
  --paper: #eaf0ed;
  --card: #f7faf8;
  --ink: #16233a;
  --muted: #566672;
  --rule: #cdd9d5;
  --accent: #2c4fd1;
  --accent-ink: #ffffff;
  --bad: #b3261e;
  --bad-bg: #f7dad7;
  --good: #1b7a46;
  --good-bg: #d3edda;
  --font-display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1722;
    --card: #14212e;
    --ink: #e6eef2;
    --muted: #93a5b1;
    --rule: #263748;
    --accent: #93a6ff;
    --accent-ink: #0d1722;
    --bad: #ff8d86;
    --bad-bg: #3b2022;
    --good: #72d69c;
    --good-bg: #173424;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1722;
  --card: #14212e;
  --ink: #e6eef2;
  --muted: #93a5b1;
  --rule: #263748;
  --accent: #93a6ff;
  --accent-ink: #0d1722;
  --bad: #ff8d86;
  --bad-bg: #3b2022;
  --good: #72d69c;
  --good-bg: #173424;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.mast h1 { font-size: clamp(2rem, 7vw, 3rem); font-weight: 700; letter-spacing: -0.02em; }
.mast p { color: var(--muted); margin-top: 8px; max-width: 46ch; }

/* Menu */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode {
  text-align: left; background: var(--card); border: 1.5px solid var(--rule); border-radius: 10px;
  padding: 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.mode:hover { border-color: var(--accent); }
.mode h2 { font-size: 1.35rem; }
.mode .profile { color: var(--muted); font-size: .92rem; }
.mode .eg { font-family: var(--font-mono); font-size: .85rem; }
.mode .best { font-size: .82rem; color: var(--muted); margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
.mode.endless { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.mode.endless .profile, .mode.endless .best, .mode.endless .eg { color: var(--accent-ink); opacity: .9; }
.mode.endless:hover { border-color: var(--ink); }

/* Controls shared */
.btn {
  border: 1.5px solid var(--ink); background: transparent; border-radius: 8px; padding: 10px 16px;
  font-weight: 600; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.quiet { border-color: var(--rule); color: var(--muted); font-weight: 500; }
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:disabled { opacity: .5; cursor: default; }
.btn[hidden] { display: none; }

/* Play sheet */
.sheet {
  background:
    repeating-linear-gradient(to bottom, transparent 0 35px, var(--rule) 35px 36px),
    var(--card);
  border: 1.5px solid var(--rule); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 20px;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; justify-content: space-between; background: var(--card); padding: 8px 10px; border-radius: 8px; }
.bar .left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-width: 0; }
.pill { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.stat { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lives { display: inline-flex; gap: 5px; vertical-align: middle; }
.life { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); }
.life.gone { background: transparent; border: 1.5px solid var(--muted); }

.say { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); padding: 12px; border-radius: 8px; align-items: center; }
.hear { padding: 14px 20px; font-size: 1.05rem; }
.hear svg { width: 22px; height: 22px; fill: currentColor; }
.hint { font-family: var(--font-mono); font-size: 1.4rem; letter-spacing: .25em; color: var(--muted); padding-left: 4px; }
.hint:empty { display: none; }
.pronline { flex-basis: 100%; font-family: var(--font-mono); font-size: 1.05rem; color: var(--ink); background: var(--paper); border-radius: 6px; padding: 8px 12px; overflow-wrap: anywhere; }
.pronline[hidden] { display: none; }
.notice { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.notice[hidden] { display: none; }

form.answer { display: flex; flex-wrap: wrap; gap: 10px; background: var(--card); padding: 12px; border-radius: 8px; }
form.answer input[type="text"] {
  flex: 1 1 14rem; min-width: 0; font-family: var(--font-mono); font-size: 1.5rem; padding: 10px 12px;
  border: 1.5px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); letter-spacing: .06em;
}
form.answer input[type="text"]:disabled { opacity: .7; }

.fb { background: var(--card); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.fb[hidden] { display: none; }
.fb .verdict { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; }
.fb .verdict.ok { color: var(--good); }
.fb .verdict.no { color: var(--bad); }
.fb .detail { color: var(--muted); font-size: .95rem; }
.lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; }
.row { display: flex; gap: 2px; }
.cell {
  flex: 1 1 0; min-width: 0; max-width: 2.3rem; height: 2.5rem; display: grid; place-items: center;
  font-family: var(--font-mono); font-size: clamp(.8rem, 3.6vw, 1.4rem); border-radius: 4px; background: var(--paper);
}
.cell.match { color: var(--ink); }
.cell.good { background: var(--good-bg); color: var(--good); font-weight: 500; }
.cell.bad { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; text-decoration-thickness: 2px; }
.cell.gap { background: transparent; border: 1.5px dashed var(--rule); color: var(--muted); }
.fb .acts { display: flex; flex-wrap: wrap; gap: 10px; }

.tune { display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: .88rem; color: var(--muted); background: var(--card); padding: 10px 12px; border-radius: 8px; }
.tune label { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tune input[type="range"] { width: 8.5rem; max-width: 100%; accent-color: var(--accent); }
.tune input[type="checkbox"] { accent-color: var(--accent); width: 1.1rem; height: 1.1rem; }
.tune output { font-variant-numeric: tabular-nums; min-width: 2.6em; }
.tune select {
  font: inherit; font-size: .88rem; max-width: 100%; min-width: 0; background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--rule); border-radius: 6px; padding: 5px 8px;
}
.tune .voice { flex-basis: 100%; }
.tune .voice select { flex: 1 1 auto; }

/* Results */
.res { background: var(--card); border: 1.5px solid var(--rule); border-radius: 10px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
.res .big { font-family: var(--font-display); font-size: clamp(2.6rem, 12vw, 4.2rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.res .sub { color: var(--muted); }
.missed { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.missed li { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.missed .typed { color: var(--bad); text-decoration: line-through; }
.missed .right { color: var(--good); }
.res .acts { display: flex; flex-wrap: wrap; gap: 10px; }

@media (max-width: 520px) {
  .modes { grid-template-columns: minmax(0, 1fr); }
  .sheet { padding: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<main>
  <header class="mast">
    <h1>Dictation Speller</h1>
    <p>Listen to the word, type what you hear, and see exactly which letters slipped.</p>
  </header>

  <section id="menu" aria-label="Choose a mode">
    <div class="modes" id="modes"></div>
  </section>

  <section id="play" hidden aria-label="Spelling round">
    <div class="bar">
      <div class="left">
        <span class="pill" id="modeName"></span>
        <span class="stat" id="progress"></span>
      </div>
      <div class="left">
        <span class="lives" id="lives" hidden aria-label="Lives"></span>
        <span class="stat" id="streakStat" hidden></span>
        <button class="btn quiet" id="quit" type="button">Quit</button>
      </div>
    </div>
    <div class="sheet" style="margin-top:12px">
      <div class="say">
        <button class="btn primary hear" id="hear" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
          <span id="hearLabel">Hear the word</span>
        </button>
        <button class="btn" id="slow" type="button">Hear it slowly</button>
        <button class="btn" id="syl" type="button">Syllable by syllable</button>
        <button class="btn" id="pronBtn" type="button">Show pronunciation</button>
        <div class="hint" id="hint" aria-live="polite"></div>
        <div class="pronline" id="pron" hidden></div>
      </div>
      <div class="notice" id="noAudio" hidden></div>
      <form class="answer" id="answer" autocomplete="off">
        <input type="text" id="guess" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type the word you heard" placeholder="Type the word">
        <button class="btn primary" id="check" type="submit">Check</button>
      </form>
      <div class="fb" id="fb" hidden>
        <div class="verdict" id="verdict"></div>
        <div class="detail" id="detail"></div>
        <div id="diff" role="img"></div>
        <div class="acts">
          <button class="btn" id="retry" type="button">Try this word again</button>
          <button class="btn primary" id="next" type="button">Next word</button>
        </div>
      </div>
      <div class="tune">
        <label class="voice" for="voiceSel">Voice <select id="voiceSel" aria-label="Voice"></select></label>
        <label for="rate">Speed <input type="range" id="rate" min="0.5" max="1.2" step="0.05" value="0.8"><output id="rateOut">0.80x</output></label>
        <label for="vol">Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="1"><output id="volOut">100%</output></label>
        <label for="twice"><input type="checkbox" id="twice" checked> Say each word twice</label>
      </div>
    </div>
  </section>

  <section id="results" hidden aria-label="Results">
    <div class="res">
      <h2 id="resTitle"></h2>
      <div class="big" id="resBig"></div>
      <p class="sub" id="resSub"></p>
      <div id="missedWrap" hidden>
        <div class="lbl">Words to practice</div>
        <ul class="missed" id="missed"></ul>
      </div>
      <div class="acts">
        <button class="btn primary" id="again" type="button">Play again</button>
        <button class="btn" id="home" type="button">Back to modes</button>
      </div>
    </div>
  </section>
</main>

  /* ---------- Letter-by-letter comparison ---------- */
  function align(correct, attempt) {
    var n = correct.length, m = attempt.length, i, j;
    var dp = [];
    for (i = 0; i <= n; i++) { dp.push(new Array(m + 1)); dp[i][0] = i; }
    for (j = 0; j <= m; j++) dp[0][j] = j;
    for (i = 1; i <= n; i++) {
      for (j = 1; j <= m; j++) {
        var cost = correct[i - 1] === attempt[j - 1] ? 0 : 1;
        dp[i][j] = Math.min(dp[i - 1][j - 1] + cost, dp[i - 1][j] + 1, dp[i][j - 1] + 1);
      }
    }
    var ops = [];
    i = n; j = m;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && correct[i - 1] === attempt[j - 1] && dp[i][j] === dp[i - 1][j - 1]) {

    var verdict = $('verdict'), detail = $('detail');
    if (ok) {
      verdict.textContent = first ? 'Correct' : 'Correct this time';
      verdict.className = 'verdict ok';
      detail.textContent = first ? 'Every letter matches.' : 'This retry does not change your score.';
    } else {
      verdict.textContent = 'Not quite';
      verdict.className = 'verdict no';
      var k = 0;
      while (k < ops.length && ops[k].type === 'match') k++;
      var errs = ops.filter(function (o) { return o.type !== 'match'; }).length;
      var msg;
      if (k === 0) msg = 'The first letter is wrong.';
      else if (k === word.length) msg = 'All of the word is there, with extra letters at the end.';
      else msg = 'The first ' + lettersWord(k) + (k === 1 ? ' is' : ' are') + ' right, and the slip starts at letter ' + (k + 1) + '.';
      detail.textContent = msg + ' ' + lettersWord(errs) + ' to fix.';
    }
    $('retry').hidden = ok;
    if (G.cur.pron) { $('pron').hidden = false; $('pronBtn').textContent = 'Hide pronunciation'; }

    var nextBtn = $('next');
    if (G.finished) nextBtn.textContent = 'See results';
    else if (endless && G.next) nextBtn.textContent = 'Next word (' + NAMES[G.next.tier] + ')';
    else nextBtn.textContent = 'Next word';
    $('fb').hidden = false;

    if (endless) {
      renderLives();
      $('streakStat').textContent = 'Streak ' + G.streak + ' · Best ' + G.bestStreak;
    } else {
      $('streakStat').textContent = 'Score ' + G.score;
    }
    speak('word');
    nextBtn.focus();
  }

  function retry() {
    G.phase = 'ask';
    var g = $('guess');
    g.value = '';
    g.disabled = false;
    $('check').disabled = false;
    $('fb').hidden = true;
    g.focus();
    speak('word');
  }

  function advance() {
    if (G.phase !== 'feedback') return;
    if (G.finished) { showResults(); return; }
    if (G.mode === 'endless') { G.cur = G.next; }
    else { G.idx++; G.cur = G.queue[G.idx]; }
    renderRound();
  }

  function showResults() {
    var endless = G.mode === 'endless';
    var prev = store[G.mode];
    var newBest = false;
    var value = endless ? G.bestStreak : G.score;
    if (prev === undefined || value > prev) { store[G.mode] = value; save(); newBest = true; }
    $('resTitle').textContent = endless ? 'Run over' : NAMES[G.mode] + ' round complete';
    $('resBig').textContent = endless ? String(G.bestStreak) : G.score + ' / ' + ROUND;
    var sub;
    if (endless) {
      sub = 'Longest streak this run. You spelled ' + G.correct + ' word' + (G.correct === 1 ? '' : 's') + ' correctly.';
    } else {
      sub = 'Spelled correctly on the first try.';
    }
    if (newBest) sub += ' New personal best.';
    $('resSub').textContent = sub;
    var list = $('missed');
    list.textContent = '';
    G.missed.forEach(function (m) {
      var li = document.createElement('li');
      var a = document.createElement('span'); a.className = 'typed'; a.textContent = m.typed;
      var b = document.createElement('span'); b.className = 'right'; b.textContent = m.word;
      li.appendChild(a); li.appendChild(b);
      list.appendChild(li);
    });
    $('missedWrap').hidden = G.missed.length === 0;
    show('results');
    $('again').focus();
  }

  function toMenu() {
    if (hasSpeech) { speakToken++; try { speechSynthesis.cancel(); } catch (e) {} }
    buildMenu();
    show('menu');
  }

  /* ---------- Wiring ---------- */
  $('answer').addEventListener('submit', check);
  $('hear').addEventListener('click', function () { speak('word'); $('guess').focus(); });
  $('slow').addEventListener('click', function () { speak('slow'); $('guess').focus(); });
  $('syl').addEventListener('click', function () { speak('syl'); $('guess').focus(); });
  $('pronBtn').addEventListener('click', function () {
    var p = $('pron');
    p.hidden = !p.hidden;
    $('pronBtn').textContent = p.hidden ? 'Show pronunciation' : 'Hide pronunciation';
  });
  $('retry').addEventListener('click', retry);
  $('next').addEventListener('click', advance);
  $('quit').addEventListener('click', toMenu);
  $('home').addEventListener('click', toMenu);
  $('again').addEventListener('click', function () { startGame(G.mode); });
  $('voiceSel').addEventListener('change', function (e) {
    if (!hasSpeech) return;
    var name = e.target.value;
    var v = speechSynthesis.getVoices().find(function (x) { return x.name === name; });
    if (v) { voice = v; store.voice = name; save(); speak('word'); }
  });
  $('rate').addEventListener('input', function (e) {
    rate = parseFloat(e.target.value);
    $('rateOut').textContent = rate.toFixed(2) + 'x';
  });
  $('vol').addEventListener('input', function (e) {
    vol = parseFloat(e.target.value);
    $('volOut').textContent = Math.round(vol * 100) + '%';
  });

  buildMenu();
})();
</script>

</body></html>
